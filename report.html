<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Bike Parking Map | Velo-Guard</title>
   <meta name="description" content="Find mapped bicycle parking and reported theft hotspots across Switzerland.">

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">

   <style>
       :root {
           --red: #ff2020;
           --red-dark: #c90000;
           --black: #080808;
           --panel: #151515;
           --white: #f7f7f7;
           --muted: #a5a5a5;
       }

       * { box-sizing: border-box; }

       html { scroll-behavior: smooth; }

       body {
           margin: 0;
           padding: 0;
           background: var(--black);
           color: var(--white);
           font-family: Arial, Helvetica, sans-serif;
       }

       h1, h2, h3, nav, .map-button {
           font-family: "Special Gothic Expanded One", sans-serif;
       }

       .page-title {
           margin: 42px 16px 24px;
           color: var(--red);
           text-align: center;
           font-size: clamp(44px, 9vw, 100px);
           line-height: 1.15;
           letter-spacing: 1px;
           text-shadow: 0 0 24px rgba(255, 32, 32, 0.18);
       }

       #bike-map {
           width: min(1120px, calc(100% - 36px));
           height: min(68vh, 680px);
           min-height: 420px;
           margin: 0 auto 70px;
           overflow: hidden;
           background: #222;
           border: 1px solid #343434;
           border-radius: 16px;
           box-shadow: 0 16px 45px rgba(0, 0, 0, 0.35);
       }

       .map-button {
           display: block;
           width: fit-content;
           margin: 0 auto 45px;
           padding: 14px 20px;
           background: var(--red);
           color: white;
           border-radius: 8px;
           text-decoration: none;
           transition: background 0.2s ease, transform 0.2s ease;
       }

       .map-button:hover {
           background: var(--red-dark);
           transform: translateY(-2px);
       }

       .map-tools { display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; margin:0 auto 18px; padding:0 18px; }
       .map-tools .map-button { margin:0; border:0; cursor:pointer; }
       .map-tools .tool-button { font-size:12px; }
       #map-status { flex-basis:100%; color:var(--muted); text-align:center; font-size:13px; line-height:1.5; }
       .parking-marker { background:#22c55e; border:2px solid white; border-radius:50%; width:14px; height:14px; box-shadow:0 1px 5px #0009; }
       .user-marker { background:#1677ff; border:3px solid white; border-radius:50%; width:18px; height:18px; box-shadow:0 0 0 7px #1677ff33; }

       .map-search { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; width:100%; }
       .map-search input { min-width:240px; width:min(420px, 90vw); padding:13px 14px; border:1px solid #555; border-radius:8px; color:#111; background:#f7f7f7; font-size:14px; }
       .map-search button { margin:0; border:0; cursor:pointer; }

       .risk-legend {
           background:#111; color:#f7f7f7; padding:10px 12px; border-radius:8px;
           border:1px solid #333; font:12px Arial, Helvetica, sans-serif; line-height:1.9;
           box-shadow:0 4px 14px #0008;
       }
       .risk-legend strong { display:block; margin-bottom:2px; }
       .risk-dot {
           display:inline-block; width:11px; height:11px; border-radius:50%;
           border:2px solid #fff; margin-right:6px; vertical-align:middle;
       }

       footer {
           padding: 26px 16px;
           color: #777;
           text-align: center;
           font-size: 12px;
           border-top: 1px solid #202020;
       }

       .leaflet-popup-content { font-family: Arial, Helvetica, sans-serif; line-height: 1.6; }
       .leaflet-popup-content a { color: #c00; font-weight: bold; }

       @media (max-width: 600px) {
           .page-title { margin-top: 65px; margin-bottom: 24px; }
           #bike-map { width: calc(100% - 24px); min-height: 380px; height: 58vh; border-radius: 12px; margin-bottom: 48px; }
       }

       ::-webkit-scrollbar { display: none; }

       .vg-header {
           width: 100%;
           min-height: 78px;
           margin: 0;
           padding: 0;
           background: #090909;
           border-bottom: 1px solid #292929;
           position: relative;
           z-index: 1000;
       }

       .vg-header-inner {
           width: min(1100px, calc(100% - 40px));
           min-height: 78px;
           margin: 0 auto;
           display: flex;
           align-items: center;
           justify-content: space-between;
           gap: 24px;
       }

       .vg-brand {
           display: inline-flex;
           align-items: center;
           gap: 12px;
           flex-shrink: 0;
           text-decoration: none;
           color: #f5f5f5;
           font-family: "Special Gothic Expanded One", Impact, sans-serif;
           font-size: 17px;
           letter-spacing: 1px;
       }

       .vg-brand-mark {
           width: 35px;
           height: 35px;
           display: grid;
           place-items: center;
           border: 2px solid var(--red);
           color: var(--red);
           font-size: 17px;
           transform: skew(-5deg);
       }

       .vg-header nav.vg-links {
           width: auto;
           max-width: 100%;
           margin: 0;
           padding: 0;
           position: static;
           display: flex;
           align-items: center;
           justify-content: flex-end;
           gap: 16px;
           font-family: Arial, Helvetica, sans-serif;
       }

       .lang-header-slot { display:flex; align-items:center; }

       .vg-header nav.vg-links ul {
           display: flex;
           flex-wrap: wrap;
           align-items: center;
           justify-content: flex-end;
           list-style: none;
           margin: 0;
           padding: 0;
           gap: 20px;
       }

       .vg-header nav.vg-links li { position: static; }

       .vg-header nav.vg-links a {
           display: block;
           padding: 10px 0;
           color: #b4b4b4;
           text-decoration: none;
           font-family: Arial, Helvetica, sans-serif;
           font-size: 13px;
           white-space: nowrap;
           transition: color 0.2s ease;
       }

       .vg-header nav.vg-links a:hover,
       .vg-header nav.vg-links a:focus { color: #fff; }

       @media (max-width: 600px) {
           .vg-header-inner { width: calc(100% - 28px); gap: 12px; }
           .vg-brand { gap: 8px; font-size: 13px; }
           .vg-brand-mark { width: 30px; height: 30px; font-size: 15px; }
           .vg-header nav.vg-links ul { gap: 11px; }
           .vg-header nav.vg-links a { font-size: 10px; }
       }

       .language-select {
           background: #141414; color: #f5f5f5; border: 1px solid #444;
           border-radius: 5px; padding: 8px 9px; font-size: 12px; max-width: 100%;
       }
       .lang-wrap { display:flex; align-items:center; gap:7px; }
       .lang-label { color:#aaa; font-size:11px; text-transform:uppercase; letter-spacing:1px; }
       @media (max-width:700px) { .language-select { padding:7px 5px; font-size:11px; } }
   
.false-report{margin:10px auto 0;max-width:760px;font-size:12px;line-height:1.6;color:#8d8d8d;text-align:center}
.false-report a{color:#ff7777;font-weight:bold;word-break:break-all}
</style>
</head>

<body id="home">
   <header class="vg-header">
       <div class="vg-header-inner">
           <a class="vg-brand" href="index.html" aria-label="Velo-Guard home">
               <span class="vg-brand-mark" aria-hidden="true">V</span>
               <span>VELO-GUARD</span>
           </a>
           <nav class="vg-links" aria-label="Main navigation">
               <ul>
                   <li><a href="index.html" data-i18n="nav-home">HOME</a></li>
                   <li><a href="map.html" data-i18n="nav-map">MAP</a></li>
                   <li><a href="report.html" data-i18n="nav-report">REPORT THEFT</a></li>
               </ul>
               <div class="lang-header-slot"><label class="lang-wrap"><span class="lang-label" data-i18n="language">LANGUAGE</span><select class="language-select" id="language-select" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option><option value="de">DE</option><option value="it">IT</option></select></label></div>
           </nav>
       </div>
   </header>

   <main>
       <h1 class="page-title" data-i18n="map-title">BIKE PARKING MAP</h1>
       <div class="map-tools" aria-label="Map tools">
           <div class="map-search">
               <input id="place-search" type="search" autocomplete="postal-code" data-i18n-placeholder="search-placeholder" placeholder="Enter a Swiss town or postcode (e.g. Cologny or 1223)">
               <button type="button" class="map-button tool-button" id="search-button" data-i18n="search-button">SEARCH PLACE</button>
           </div>
           <button type="button" class="map-button tool-button" id="locate-button" data-i18n="locate-button">📍 FIND MY LOCATION</button>
           <button type="button" class="map-button tool-button" id="parking-button" data-i18n="parking-button">🚲 HIDE BIKE PARKING</button>
           <span id="map-status" role="status" aria-live="polite"></span>
       </div>
       <div id="bike-map" aria-label="Map of bicycle parking and report locations"></div>
   </main>

   <footer><span data-i18n="map-footer">Velo-Guard · Switzerland</span><p class="false-report" data-i18n="false-report">Made a false report or a mistake? Email <a href="mailto:snowypenguiner@gmail.com">snowypenguiner@gmail.com</a> and we will remove it.</p></footer>

function vgLanguage() { try { return localStorage.getItem('vgLanguage') || document.documentElement.lang || 'en'; } catch (_) { return document.documentElement.lang || 'en'; } }
function vgT(key) { const lang = vgLanguage(); return (VG_TRANSLATIONS[lang] && VG_TRANSLATIONS[lang][key]) || VG_TRANSLATIONS.en[key] || key; }
function vgApplyLanguage(lang) {
 if (!VG_TRANSLATIONS[lang]) lang = 'en';
 try { localStorage.setItem('vgLanguage', lang); } catch (_) {}
 document.documentElement.lang = lang;
 document.querySelectorAll('[data-i18n]').forEach(el => {
   const key = el.getAttribute('data-i18n');
   const val = (VG_TRANSLATIONS[lang] || {})[key] || VG_TRANSLATIONS.en[key];
   if (val !== undefined) el.innerHTML = val;
 });
 document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
   const key = el.getAttribute('data-i18n-placeholder');
   const val = (VG_TRANSLATIONS[lang] || {})[key] || VG_TRANSLATIONS.en[key];
   if (val !== undefined) el.placeholder = val;
 });
 document.querySelectorAll('[data-i18n-aria]').forEach(el => {
   const key = el.getAttribute('data-i18n-aria');
   const val = (VG_TRANSLATIONS[lang] || {})[key] || VG_TRANSLATIONS.en[key];
   if (val !== undefined) el.setAttribute('aria-label', val);
 });
 const selector = document.getElementById('language-select');
 if (selector && selector.value !== lang) selector.value = lang;
 window.dispatchEvent(new CustomEvent('vg-language-changed', { detail: { lang } }));
}
document.addEventListener('DOMContentLoaded', () => {
 const selector = document.getElementById('language-select');
 if (selector) selector.addEventListener('change', () => vgApplyLanguage(selector.value));
 vgApplyLanguage(vgLanguage());
});

<script>
 // ---------- Supabase connection ----------
 const SUPABASE_URL = "https://zeoagmdjckboyhwridcl.supabase.co";
 const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Cd4EOS1iNiOagmLPxLx8Ew_7kcT0MFX";
 const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

 // ---------- Map setup ----------
 const queryParams = new URLSearchParams(location.search);
 const map = L.map("bike-map").setView([46.8182, 8.2275], 8);
 const switzerlandBounds = L.latLngBounds([45.70, 5.80], [47.95, 10.60]);
 L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { attribution: "Tiles &copy; Esri", maxZoom: 19 }).addTo(map);

 const reportsLayer = L.layerGroup().addTo(map);   // coloured theft hotspots
 const parkingLayer = L.layerGroup().addTo(map);   // bike racks
 const parkingIcon = L.divIcon({className:"", html:'<div class="parking-marker"></div>', iconSize:[14,14], iconAnchor:[7,7]});
 const userIcon = L.divIcon({className:"", html:'<div class="user-marker"></div>', iconSize:[18,18], iconAnchor:[9,9]});
 let userMarker = null, reportPin = null, parkingVisible = true, lastParkingRequest = "", parkingRequestInProgress = false;
 const mapStatus = document.getElementById("map-status");

 function setStatus(message) { mapStatus.textContent = message; }
 function escapeHtml(value) { return String(value).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]); }
 function reportLink(lat, lng) { return "report.html?lat=" + encodeURIComponent(lat.toFixed(6)) + "&lng=" + encodeURIComponent(lng.toFixed(6)); }

 function popupContent(lat, lng) {
   return '<strong>' + escapeHtml(vgT('msg-map-pick')) + '</strong><br>' + lat.toFixed(5) + ', ' + lng.toFixed(5) + '<br><a href="' + reportLink(lat, lng) + '">' + escapeHtml(vgT('msg-report-at-location')) + '</a>';
 }

 // ---------- Theft reports from Supabase ----------
 // Reports within about 100 m of each other count as the same place.
 const GRID_DECIMALS = 3;
 const RACK_RADIUS_METRES = 100;   // reports this close to a bike rack count for that rack
 let theftSpots = [];
 let theftPoints = [];   // every single report, used to colour the bike racks
 let parkingItems = [];  // bike racks loaded from OpenStreetMap

 // How many theft reports are within RACK_RADIUS_METRES of a point
 function reportsNear(lat, lng) {
   const metresPerDegLat = 111320, metresPerDegLng = 111320 * Math.cos(lat * Math.PI / 180);
   let count = 0;
   theftPoints.forEach(p => {
     const dy = (p.lat - lat) * metresPerDegLat, dx = (p.lng - lng) * metresPerDegLng;
     if (dx * dx + dy * dy <= RACK_RADIUS_METRES * RACK_RADIUS_METRES) count++;
   });
   return count;
 }

 function riskLevel(count) {
   if (count >= 3) return { color: '#ff2020', key: 'risk-high' };    // 3+ reports  = red
   if (count >= 1) return { color: '#ffc107', key: 'risk-medium' };  // 1-2 reports = yellow
   return { color: '#22c55e', key: 'risk-low' };                     // 0 reports   = green
 }

 async function loadTheftReports() {
   const { data, error } = await supabaseClient
     .from('theft_reports')
     .select('latitude, longitude');

   if (error) {
     console.error('Could not load theft reports:', error);
     setStatus(vgT('msg-reports-failed'));
     return;
   }

   // Group nearby reports together and count them
   const groups = new Map();
   theftPoints = [];
   (data || []).forEach(row => {
     const lat = Number(row.latitude), lng = Number(row.longitude);
     if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
     theftPoints.push({ lat, lng });
     const key = lat.toFixed(GRID_DECIMALS) + ',' + lng.toFixed(GRID_DECIMALS);
     const g = groups.get(key) || { latSum: 0, lngSum: 0, count: 0 };
     g.latSum += lat; g.lngSum += lng; g.count++;
     groups.set(key, g);
   });

   theftSpots = [...groups.values()].map(g => ({ lat: g.latSum / g.count, lng: g.lngSum / g.count, count: g.count }));
   drawTheftSpots();
   drawParking();   // re-colour the bike racks now that we know where thefts happened
 }

 function drawTheftSpots() {
   reportsLayer.clearLayers();
   theftSpots.forEach(spot => {
     const risk = riskLevel(spot.count);
     L.circleMarker([spot.lat, spot.lng], {
       radius: 9 + Math.min(spot.count, 10),
       color: '#ffffff',
       weight: 2,
       fillColor: risk.color,
       fillOpacity: 0.85,
       bubblingMouseEvents: false   // clicking a hotspot won't move the report pin
     })
     .bindPopup(
       '<strong style="color:' + risk.color + '">' + escapeHtml(vgT(risk.key)) + '</strong><br>' +
       escapeHtml(vgT('risk-count').replace('{count}', spot.count)) + '<br>' +
       '<a href="' + reportLink(spot.lat, spot.lng) + '">' + escapeHtml(vgT('msg-report-at-location')) + '</a>'
     )
     .addTo(reportsLayer);
   });
 }

 // Legend in the bottom-right corner of the map
 const legend = L.control({ position: 'bottomright' });
 legend.onAdd = function () {
   this._div = L.DomUtil.create('div', 'risk-legend');
   this.update();
   return this._div;
 };
 legend.update = function () {
   const dot = color => '<span class="risk-dot" style="background:' + color + '"></span>';
   this._div.innerHTML = '<strong>' + escapeHtml(vgT('legend-title')) + '</strong>' +
     dot('#22c55e') + '0 · ' + escapeHtml(vgT('risk-low')) + '<br>' +
     dot('#ffc107') + '1–2 · ' + escapeHtml(vgT('risk-medium')) + '<br>' +
     dot('#ff2020') + '3+ · ' + escapeHtml(vgT('risk-high')) +
     '<div style="margin-top:6px;color:#aaa;max-width:190px;line-height:1.5">' + escapeHtml(vgT('legend-racks')) + '</div>';
 };
 legend.addTo(map);

 // ---------- Bike parking from OpenStreetMap ----------
 async function loadBikeParking(force = false) {
   if (!parkingVisible || parkingRequestInProgress || map.getZoom() < 10) {
     if (parkingVisible && map.getZoom() < 10) setStatus(vgT('msg-zoom'));
     return;
   }
   const b = map.getBounds();
   const bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map(n => n.toFixed(3)).join(",");
   if (!force && bbox === lastParkingRequest) return;
   lastParkingRequest = bbox; parkingRequestInProgress = true; setStatus(vgT('msg-loading-parking'));
   const query = '[out:json][timeout:25];(node["amenity"="bicycle_parking"](' + bbox + ');way["amenity"="bicycle_parking"](' + bbox + '););out center tags;';
   try {
     const response = await fetch("https://overpass.osm.ch/api/interpreter?data=" + encodeURIComponent(query));
     if (!response.ok) throw new Error('parking unavailable');
     const data = await response.json();
     parkingItems = [];
     (data.elements || []).forEach(item => {
       const lat = item.lat ?? item.center?.lat, lng = item.lon ?? item.center?.lon;
       if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
       parkingItems.push({ lat, lng, tags: item.tags || {} });
     });
     drawParking();
     setStatus(vgT('msg-parking-count').replace('{count}', parkingItems.length));
   } catch (_) { lastParkingRequest = ''; setStatus(vgT('msg-parking-failed')); }
   finally { parkingRequestInProgress = false; }
 }

 // Draw the bike racks: green by default, yellow / red when thefts are reported nearby
 function drawParking() {
   parkingLayer.clearLayers();
   parkingItems.forEach(({ lat, lng, tags }) => {
     const nearby = reportsNear(lat, lng);
     const risk = riskLevel(nearby);   // 0 = green, 1-2 = yellow, 3+ = red
     const icon = L.divIcon({ className: "", html: '<div class="parking-marker" style="background:' + risk.color + '"></div>', iconSize: [14,14], iconAnchor: [7,7] });
     const name = tags.name || tags.operator || 'Bike parking';
     const details = [tags.capacity ? 'Capacity: ' + tags.capacity : '', tags.covered === 'yes' ? 'Covered parking' : '', tags.bicycle_parking ? 'Type: ' + tags.bicycle_parking.replaceAll('_', ' ') : ''].filter(Boolean).join(' · ');
     L.marker([lat, lng], { icon })
       .bindPopup(
         '<strong>' + escapeHtml(name) + '</strong><br>Bike parking' + (details ? '<br>' + escapeHtml(details) : '') + '<br>' +
         '<strong style="color:' + risk.color + '">' + escapeHtml(vgT(risk.key)) + '</strong> · ' +
         escapeHtml(vgT('risk-count').replace('{count}', nearby)) + '<br>' +
         '<a href="' + reportLink(lat, lng) + '">' + escapeHtml(vgT('msg-report-at-location')) + '</a>'
       )
       .addTo(parkingLayer);
   });
 }

 // ---------- Clicking the map to choose a theft location ----------
 map.on('click', event => {
   const lat = event.latlng.lat, lng = event.latlng.lng;
   if (reportPin) reportPin.setLatLng(event.latlng);
   else reportPin = L.marker(event.latlng, {draggable:false, title:'Chosen report location'}).addTo(map);
   reportPin.bindPopup(popupContent(lat, lng)).openPopup();
   setStatus(vgT('msg-map-pick') + ': ' + lat.toFixed(5) + ', ' + lng.toFixed(5));
 });

 // ---------- Buttons ----------
 document.getElementById('locate-button').addEventListener('click', () => {
   if (!navigator.geolocation) { setStatus(vgT('msg-location-not-supported')); return; }
   setStatus(vgT('msg-location-request'));
   navigator.geolocation.getCurrentPosition(position => {
     const p = [position.coords.latitude, position.coords.longitude];
     if (userMarker) userMarker.setLatLng(p); else userMarker = L.marker(p, {icon:userIcon, title:'Your current location'}).addTo(map).bindPopup('Your current location (visible only in this browser)');
     map.setView(p, 16); userMarker.openPopup(); setStatus(vgT('msg-location-found')); loadBikeParking(true);
   }, () => setStatus(vgT('msg-location-denied')), {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
 });

 document.getElementById('parking-button').addEventListener('click', function() {
   parkingVisible = !parkingVisible;
   if (parkingVisible) { parkingLayer.addTo(map); lastParkingRequest = ''; loadBikeParking(true); this.textContent = vgT('parking-button'); }
   else { map.removeLayer(parkingLayer); setStatus(''); this.textContent = vgT('parking-show'); }
 });

 async function searchPlace() {
   const query = document.getElementById('place-search').value.trim();
   if (!query) { setStatus(vgT('msg-map-search-empty')); return; }
   setStatus(vgT('msg-map-searching'));
   try {
     const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=ch&addressdetails=1&limit=1&q=' + encodeURIComponent(query);
     const response = await fetch(url, {headers:{'Accept':'application/json'}});
     if (!response.ok) throw new Error('lookup failed');
     const results = await response.json();
     if (!results.length) { setStatus(vgT('msg-map-search-failed')); return; }
     const place = results[0], lat = Number(place.lat), lng = Number(place.lon);
     map.setView([lat,lng], 15);
     if (userMarker) userMarker.setLatLng([lat,lng]); else userMarker = L.marker([lat,lng], {icon:userIcon, title:'Searched place'}).addTo(map);
     userMarker.bindPopup(escapeHtml(place.display_name || query)).openPopup();
     setStatus(vgT('msg-map-search-success')); loadBikeParking(true);
   } catch (_) { setStatus(vgT('msg-map-search-failed')); }
 }
 document.getElementById('search-button').addEventListener('click', searchPlace);
 document.getElementById('place-search').addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); searchPlace(); } });

 // ---------- Language changes ----------
 window.addEventListener('vg-language-changed', () => {
   document.getElementById('parking-button').textContent = parkingVisible ? vgT('parking-button') : vgT('parking-show');
   if (queryParams.get('returnToReport') === '1') setStatus(vgT('msg-choose-location-mode'));
   legend.update();
   drawTheftSpots();
   drawParking();
 });

 // ---------- Start ----------
 map.on('moveend', () => loadBikeParking());
 map.fitBounds(switzerlandBounds, {padding:[20,20]});
 if (queryParams.get('returnToReport') === '1') setStatus(vgT('msg-choose-location-mode'));

 // Coming from "See it on the map" after a report: zoom straight to that spot
 const focusLat = Number(queryParams.get('lat')), focusLng = Number(queryParams.get('lng'));
 if (queryParams.has('lat') && queryParams.has('lng') && Number.isFinite(focusLat) && Number.isFinite(focusLng)) {
   map.setView([focusLat, focusLng], 16);
 }

 loadTheftReports();
 window.addEventListener('load', () => { map.invalidateSize(); loadBikeParking(); });
</script>
